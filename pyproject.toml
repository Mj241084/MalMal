[project]
name = "malmal"
version = "0.1.0"
description = "MAL MAL — online home appliances store"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "django-htmx>=1.28",
    "gunicorn>=27.0.1",
    "jdatetime>=5.0",
    "Pillow>=11.0",
    "redis>=8.1.0",
]

[dependency-groups]
dev = [
    "brotli>=1.2.1",
    "fonttools>=4.68.0",
    "pytest>=8.0",
    "pytest-django>=4.9",
    "ruff>=0.11",
]

[tool.ruff]
target-version = "py312"
line-length = 120
# Migrations are generated by Django; reformatting them adds churn on every makemigrations.
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["config", "apps"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
pythonpath = ["."]
