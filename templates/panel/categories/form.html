{% extends "panel/base.html" %}
{% block content %}
<h1 class="text-h2 mb-6">{% if category %}ویرایش {{ category.name }}{% else %}افزودن دسته{% endif %}</h1>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <form method="post" enctype="multipart/form-data" class="bg-base-100 p-6 rounded-box border">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary mt-4">ذخیره</button>
    </form>
    {% if category %}
    <div id="attrs">{% include "panel/categories/_sec_attrs.html" %}</div>
    {% endif %}
</div>
{% endblock %}
