{% extends "panel/shell.html" %}
{% block title %}برندها{% endblock %}
{% block content %}
<div class="flex flex-col gap-4">
  <div class="flex items-center justify-between gap-3">
    {% include "panel/partials/_page_heading.html" with title="برندها" %}
    {% if can_add %}
      <button type="button" popovertarget="brand-modal" class="btn btn-primary h-10"
              hx-get="{% url 'panel:brand_new' %}" hx-target="#brand-modal-body" hx-swap="innerHTML">افزودن برند</button>
    {% endif %}
  </div>
  <div id="brands-results" aria-live="polite">{% include "panel/brands/_list_results.html" %}</div>
</div>
<div class="modal" popover id="brand-modal"><div class="modal-box max-w-md" id="brand-modal-body"></div></div>
{% endblock %}
