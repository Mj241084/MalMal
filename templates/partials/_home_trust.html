{% load core_tags %}
<ul class="grid grid-cols-2 lg:grid-cols-4 gap-3">
  {% for item in block.items %}
    <li class="bg-base-100 border rounded-box p-4 flex items-start gap-3">
      {% icon item.icon size=20 safe=True class="text-ink-2 mt-0.5" %}
      <span class="flex flex-col">
        <span class="text-small font-medium">{{ item.title|fa_text }}</span>
        {% if item.subtitle %}<span class="text-label text-ink-3">{{ item.subtitle|fa_text }}</span>{% endif %}
      </span>
    </li>
  {% endfor %}
</ul>
