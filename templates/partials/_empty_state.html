{% load core_tags %}
<div class="flex flex-col items-center justify-center gap-2 py-16 text-center" role="status">
  <span class="text-ink-3">{% icon "package" size=40 %}</span>
  <p class="text-lead font-medium">{{ title|fa_text }}</p>
  {% if description %}<p class="text-small text-ink-2 max-w-sm">{{ description|fa_text }}</p>{% endif %}
  {% if action_url %}
    <a href="{{ action_url }}" class="btn btn-sm bg-base-300 border mt-2">{{ action_label }}</a>
  {% endif %}
</div>
