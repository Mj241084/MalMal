{% load core_tags %}
<nav aria-label="بخش‌های حساب کاربری" class="mt-4">
  <div role="tablist" class="tabs tabs-border text-small overflow-x-auto no-scrollbar">
    <a href="{% url 'accounts:profile' %}"
       role="tab"
       class="tab{% if active == 'profile' %} tab-active{% endif %}"
       {% if active == 'profile' %}aria-current="page"{% endif %}>اطلاعات حساب</a>
    <a href="{% url 'accounts:addresses' %}"
       role="tab"
       class="tab{% if active == 'addresses' %} tab-active{% endif %}"
       {% if active == 'addresses' %}aria-current="page"{% endif %}>آدرس‌ها</a>
    <a href="{% url 'orders:list' %}"
       role="tab"
       class="tab{% if active == 'orders' %} tab-active{% endif %}"
       {% if active == 'orders' %}aria-current="page"{% endif %}>سفارش‌ها</a>
    <a href="{% url 'engagement:wishlist' %}"
       role="tab"
       class="tab{% if active == 'wishlist' %} tab-active{% endif %}"
       {% if active == 'wishlist' %}aria-current="page"{% endif %}>علاقه‌مندی‌ها</a>
  </div>
</nav>
